name: Build Picly Desktop (macOS arm64)

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Target sekarang: macOS Apple Silicon (arm64) dulu.
  # Windows/Linux menyusul nanti — jangan enable sebelum mac build verified.
  build-mac:
    runs-on: macos-14-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm install runs postinstall: fix-electron + rebuild-native.mjs
      # (compiles better-sqlite3 for BOTH host Node and Electron ABI), plus
      # trustedDependencies lifecycle (electron download, sharp libvips,
      # onnxruntime binary). Without these the packaged app crashes.
      - name: Install deps (postinstall rebuilds native modules)
        run: |
          cd desktop
          npm install

      # Models are NOT committed to git (~190MB) — fetch det_10g + w600k_r50
      # into desktop/models/ (gitignored), which electron-builder bundles via
      # extraResources -> Contents/Resources/models.
      - name: Fetch ONNX models
        run: |
          cd desktop
          node scripts/fetch-models.mjs

      - name: Build + package (electron-builder, arm64 dmg)
        run: |
          cd desktop
          # electron:build = build:local (tsc) + prepare-native electron +
          # vite build + electron-builder. All native modules unpacked via
          # asarUnpack so better-sqlite3 / sharp / onnxruntime load at runtime.
          npm run electron:build
        env:
          # Backend not required at build time (app is fully local) — this is
          # just the compile-time default; leave empty to avoid confusion.
          PICLY_API_URL: ''
          # No signing cert yet — disable identity auto-discovery so
          # electron-builder doesn't hang/timeout searching for a cert.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # No Apple notarization credentials yet (unsigned build is fine for
          # internal/testing; Gatekeeper warning is expected on first open).
          APPLE_ID: ''
          APPLE_APP_SPECIFIC_PASSWORD: ''
          APPLE_TEAM_ID: ''

      - uses: actions/upload-artifact@v4
        with:
          name: picly-mac-arm64
          path: desktop/dist/*.dmg
          retention-days: 14
