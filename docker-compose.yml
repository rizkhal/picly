version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: picly
      POSTGRES_USER: picly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-picly}
    volumes:
      - picly_pgdata:/var/lib/postgresql/data
      - ./services/face-search/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picly"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/face-search/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://picly:${POSTGRES_PASSWORD:-picly}@db:5432/picly
      PICLY_API_KEY: ${PICLY_API_KEY:-}
      UPLOAD_DIR: /tmp/picly_uploads
      SCAN_THRESHOLD: "1000"
    volumes:
      - /Users/rizkal/picly-photos-local:/photos:ro
      - /Volumes/XStorage:/host-xstorage:ro
      - picly_uploads:/tmp/picly_uploads
      - picly_thumbs:/tmp/picly_thumbs
      - picly_insightface:/root/.insightface/models
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  picly_pgdata:
  picly_uploads:
  picly_thumbs:
  picly_insightface:
