services:
  db:
    # pgvector image (includes the vector extension used for HNSW face search)
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: picly
      POSTGRES_USER: picly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-picly}
    volumes:
      - picly_pgdata:/var/lib/postgresql/data
      # Mount the directory, not a single file: Colima/sshfs cannot bind-mount
      # individual files, and postgres auto-runs every *.sql in this dir.
      - ./services/face-search/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picly"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/face-search/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://picly:${POSTGRES_PASSWORD:-picly}@db:5432/picly
      PICLY_API_KEY: ${PICLY_API_KEY:-}
      UPLOAD_DIR: /tmp/picly_uploads
      # Desktop "+ Add folder" maps picked host folders onto these read-only
      # /host roots and scans in place (no copying). Multiple roots are supported
      # as comma-separated "source=target" pairs: /Volumes covers every external
      # drive, $HOME the user folder. On Colima/Lima each source must also be
      # listed in colima.yaml mounts so the VM can actually see it.
      HOST_MOUNTS: /Volumes=/host/Volumes,${HOME:-/Users/rizkal}=/host${HOME:-/Users/rizkal}
    volumes:
      # Read-only views of host storage for in-place scanning
      - /Volumes:/host/Volumes:ro
      - ${HOME:-/Users/rizkal}:/host${HOME:-/Users/rizkal}:ro
      # Temp dir for /search query images; thumbnails; face-model cache
      - picly_uploads:/tmp/picly_uploads
      - picly_thumbs:/tmp/picly_thumbs
      - picly_insightface:/root/.insightface/models
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  picly_pgdata:
  picly_uploads:
  picly_thumbs:
  picly_insightface:
