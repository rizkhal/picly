# Picly backend — Hono (in-app update manifest only)
#
# The desktop app is fully local (scan/search/browse via ONNX + SQLite, no
# backend). This service exists solely to serve the in-app update manifest
# (GET /app/update) that the desktop checks for new releases.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NODE_ENV: production
      # Manifest is compiled-in; override here when releasing new versions
      # PICLY_LATEST_VERSION: "1.1.0"
      # PICLY_UPDATE_URL: "https://github.com/rizkhal/picly/releases/latest"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8000/health').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 30s
      timeout: 5s
      retries: 3
